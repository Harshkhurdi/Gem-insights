name: Verify GeM Intelligence
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gem
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: gem_intelligence_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gem -d gem_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://gem:test-only-password@localhost:5432/gem_intelligence_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
