services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gem_intelligence
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gem_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gem -d gem_intelligence"]
      interval: 5s
      retries: 10
volumes:
  gem_pg:
